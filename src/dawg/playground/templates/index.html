<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DAWG Playground</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 720px;
      margin: 4rem auto;
      padding: 0 1.5rem;
      line-height: 1.4;
    }
    h1 { margin: 0 0 0.25rem 0; }
    .hint { color: #777; font-size: 0.92rem; margin-top: 0.25rem; }
    label { display: block; margin-top: 1.25rem; font-weight: 600; font-size: 0.95rem; }
    input[type="text"], input[type="url"], input[type="number"] {
      width: 100%;
      padding: 0.55rem 0.7rem;
      font-size: 1rem;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    input:focus { outline: 2px solid #4a90e2; outline-offset: -1px; }
    button {
      margin-top: 1.75rem;
      padding: 0.7rem 1.5rem;
      font-size: 1rem;
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      font-weight: 600;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <h1>DAWG Playground</h1>
  <p class="hint">Submit a URL and a query. MolmoWeb runs and you'll see the screenshots, reasoning, and actions for each step.</p>

  <form action="/run" method="post">
    <label for="url">URL</label>
    <input type="url" name="url" id="url" placeholder="https://en.wikipedia.org/wiki/Adversarial_machine_learning" required>

    <label for="query">Query</label>
    <input type="text" name="query" id="query" placeholder="What is this page about?" required>

    <label for="max_steps">Max steps</label>
    <input type="number" name="max_steps" id="max_steps" value="{{ default_max_steps }}" min="1" max="30">

    <button type="submit">Run</button>
  </form>

  <p class="hint" style="margin-top: 2.5rem;">A run typically takes 10–60s depending on max steps. The page will hang while the agent runs; don't navigate away.</p>
</body>
</html>

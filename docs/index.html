<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DAWG — playground</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 640px;
      margin: 4rem auto;
      padding: 0 1.5rem;
      line-height: 1.55;
    }
    h1 { margin: 0 0 0.25rem 0; font-size: 2.25rem; letter-spacing: -0.02em; }
    .tagline { color: #666; margin: 0 0 2.5rem 0; }
    @media (prefers-color-scheme: dark) { .tagline { color: #999; } }
    .status {
      padding: 1.25rem 1.5rem;
      border-radius: 10px;
      background: #f5f5f7;
      margin: 1.5rem 0;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #eee; }
      .status { background: #1c1c1f; }
      a { color: #6ea8fe; }
    }
    .dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
    .live { background: #16a34a; box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.7); animation: pulse 2s infinite; }
    .offline { background: #888; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.5); }
      70% { box-shadow: 0 0 0 8px rgba(22, 163, 74, 0); }
      100% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
    }
    .url {
      display: block;
      margin-top: 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.95rem;
      word-break: break-all;
    }
    .meta { color: #888; font-size: 0.85rem; margin-top: 0.5rem; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .footer {
      margin-top: 4rem;
      color: #888;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <h1>DAWG</h1>
  <p class="tagline">Detecting Adversarial Webpages against Visual Web Agents.</p>

  <div class="status" id="status">
    <span class="dot offline"></span><strong>Loading status…</strong>
  </div>

  <p><a href="https://github.com/andyye132/DAWG">github.com/andyye132/DAWG</a></p>

  <div class="footer">Final project, UW deep-learning course (RAIVN, 2026).</div>

  <script>
    // Fetch status.json (sibling file on the same GitHub Pages site)
    // Bust cache so an updated push shows up promptly.
    fetch('status.json?t=' + Date.now())
      .then(r => r.json())
      .then(data => {
        const el = document.getElementById('status');
        const updated = data.last_updated || 'unknown';
        if (data.is_live && data.playground_url) {
          el.innerHTML = `
            <span class="dot live"></span><strong>Playground is live.</strong>
            <a class="url" href="${data.playground_url}" target="_blank" rel="noopener">${data.playground_url}</a>
            <div class="meta">Login: ask Andy. Updated ${updated}.</div>`;
        } else {
          el.innerHTML = `
            <span class="dot offline"></span><strong>Playground is offline.</strong>
            <div class="meta">Last live ${updated}.</div>`;
        }
      })
      .catch(err => {
        document.getElementById('status').innerHTML =
          `<span class="dot offline"></span><strong>Status unknown.</strong>
           <div class="meta">Failed to fetch status.json: ${err.message}</div>`;
      });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DAWG Playground</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 720px;
      margin: 4rem auto;
      padding: 0 1.5rem;
      line-height: 1.4;
    }
    h1 { margin: 0 0 0.25rem 0; }
    .hint { color: #777; font-size: 0.92rem; margin-top: 0.25rem; }
    label { display: block; margin-top: 1.25rem; font-weight: 600; font-size: 0.95rem; }
    input[type="text"], input[type="url"], input[type="number"] {
      width: 100%;
      padding: 0.55rem 0.7rem;
      font-size: 1rem;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    input:focus { outline: 2px solid #4a90e2; outline-offset: -1px; }
    button {
      margin-top: 1.75rem;
      padding: 0.7rem 1.5rem;
      font-size: 1rem;
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      font-weight: 600;
    }
    button:hover:not(:disabled) { background: #1d4ed8; }
    button:disabled {
      background: #94a3b8;
      cursor: wait;
      opacity: 0.85;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 8px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      margin-top: 1rem;
      color: #555;
      font-size: 0.9rem;
      display: none;
    }
    form.busy fieldset { opacity: 0.55; pointer-events: none; }
  </style>
</head>
<body>
  <h1>DAWG Playground</h1>
  <p class="hint">Submit a URL and a query. MolmoWeb runs and you'll see the screenshots, reasoning, and actions for each step.</p>

  <form id="run-form" action="/run" method="post">
    <fieldset style="border: 0; padding: 0; margin: 0;">
      <label for="url">URL</label>
      <input type="url" name="url" id="url" placeholder="https://en.wikipedia.org/wiki/Adversarial_machine_learning" required>

      <label for="query">Query</label>
      <input type="text" name="query" id="query" placeholder="What is this page about?" required>

      <label for="max_steps">Max steps</label>
      <input type="number" name="max_steps" id="max_steps" value="{{ default_max_steps }}" min="1" max="30">
    </fieldset>

    <button type="submit" id="submit-btn">Run</button>
    <div class="status" id="status">
      <span class="spinner"></span>
      Running MolmoWeb… <span id="elapsed">0s</span> elapsed. Don't navigate away; you'll land on the result when it finishes.
    </div>
  </form>

  <p class="hint" style="margin-top: 2.5rem;">A run typically takes 10–60s depending on max steps.</p>

  <script>
    const form = document.getElementById('run-form');
    const btn = document.getElementById('submit-btn');
    const status = document.getElementById('status');
    const elapsed = document.getElementById('elapsed');
    form.addEventListener('submit', () => {
      form.classList.add('busy');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Running…';
      status.style.display = 'block';
      const t0 = Date.now();
      setInterval(() => {
        elapsed.textContent = Math.round((Date.now() - t0) / 1000) + 's';
      }, 1000);
    });
  </script>
</body>
</html>
